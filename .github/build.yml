name: Flutter Build

workflow_dispatch: # This enables the manual "Run workflow" button
  # (Optional) You can leave the push trigger commented out for future use:
  # push:
  #   branches: [ main ]

# on:
#   push:
#     branches: [ main, master ]
#   pull_request:
#     branches: [ main, master ]

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (.app)
        run: flutter build ios --release --no-codesign

      # Optional: Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/*.app
