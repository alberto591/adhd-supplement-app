name: Flutter Build

on:
  workflow_dispatch: # This allows you to click the manual "Run workflow" button
  # The push section below is commented out so it won't run automatically
  # push:
  #   branches: [ main, master ]

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean and Install Pods
        run: |
          flutter clean
          flutter pub get
          cd ios
          # Force a fresh pod state to apply the -G fix
          rm -rf Pods
          rm -rf Podfile.lock
          pod cache clean --all
          pod install --repo-update
          cd ..

      - name: Build iOS (.app)
        run: flutter build ios --release --no-codesign

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/*.app
