name: Flutter Build

on:
  workflow_dispatch: # This is the ONLY trigger now.

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Deep Clean and Install Pods
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .bundle
          pod cache clean --all
          pod repo update
          pod install
          cd ..

      - name: Build iOS (.app)
        run: flutter build ios --release --no-codesign

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/*.app
