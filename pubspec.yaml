name: neurostack_app
description: A daily routine and cognitive focus tracking app.
version: 1.0.1+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  
  # Localization
  flutter_localizations:
    sdk: flutter

  # Backend - Downgraded for Swift 5 / Xcode 15.4 compatibility
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_crashlytics: ^3.4.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  
  # Utilities
  url_launcher: ^6.3.2
  share_plus: ^9.0.0
  # app_settings: ^7.0.0  # Temporarily removed due to iOS Swift compiler error
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  provider: ^6.1.1
  uuid: ^4.0.0
  audioplayers: ^6.1.0
  
  # Architecture support
  get_it: ^7.6.4
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  http: ^1.6.0
  purchases_flutter: ^8.5.0
  image_picker: ^1.2.1
  pdf: ^3.11.3
  printing: ^5.13.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.0
  purchases_ui_flutter: ^8.11.0
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  mockito: any
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/magnesium_science.png
    - assets/images/vitamin_d_focus.png
    - assets/images/theanine_calm.png
    - assets/images/referral_hero.png
    - assets/images/morning_slot.png
    - assets/images/afternoon_slot.png
    - assets/images/evening_slot.png
    - assets/images/night_slot.png
    - assets/sounds/
