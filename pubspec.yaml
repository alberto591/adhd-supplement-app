name: adhd_supplement_app
description: An ADHD supplement education and referral tracking app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  
  # Backend
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  
  # Utilities
  url_launcher: ^6.2.0
  share_plus: ^9.0.0
  app_settings: ^5.1.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  provider: ^6.1.1
  uuid: ^4.0.0
  
  # Architecture support
  get_it: ^7.6.4
  intl: ^0.20.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  mockito: any
flutter:
  uses-material-design: true
